<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@p/anyeditable · source map browser</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172026;
        --muted: #64717d;
        --soft: #f5f7f8;
        --line: #d9e0e6;
        --accent: #0f766e;
        --accent-2: #9a3412;
        --accent-soft: #d9f3ef;
        --warn-soft: #fff3d6;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #fbfcfd;
      }
      button, input, textarea { font: inherit; }
      .page-shell {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
        gap: 28px;
        align-items: end;
        padding: 28px 0 22px;
        border-bottom: 1px solid var(--line);
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 {
        margin-bottom: 12px;
        font-size: 52px;
        line-height: 1;
        letter-spacing: 0;
      }
      h2 {
        margin-bottom: 0;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      h3 {
        margin-bottom: 10px;
        font-size: 13px;
        line-height: 1.2;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .lede {
        max-width: 680px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: 18px;
      }
      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
      }
      .hero-stats div {
        min-width: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .hero-stats dt {
        color: var(--muted);
        font-size: 12px;
      }
      .hero-stats dd {
        margin: 4px 0 2px;
        font-size: 28px;
        font-weight: 800;
      }
      .hero-stats small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .principles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 18px 0;
      }
      .principles span {
        padding: 6px 10px;
        border: 1px solid #b8ddd7;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #164e46;
        font-size: 12px;
        font-weight: 700;
      }
      .browser-grid {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
        padding: 22px 0 34px;
      }
      .section-heading {
        margin-bottom: 14px;
      }
      .concept-tree {
        position: sticky;
        top: 16px;
        padding-right: 10px;
      }
      .tree-list {
        display: grid;
        gap: 8px;
      }
      .tree-node {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        min-height: 58px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .tree-node:hover,
      .tree-node.active {
        border-color: var(--accent);
        background: #eefbf8;
      }
      .tree-node strong,
      .tree-node small {
        display: block;
      }
      .tree-node small {
        color: var(--muted);
      }
      .node-index {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .concept-detail {
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .detail-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .file-count {
        flex: 0 0 auto;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .summary {
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 700;
      }
      .responsibility {
        margin-bottom: 20px;
        color: var(--muted);
      }
      .io-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .info-list {
        min-width: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }
      .info-list ul,
      .file-list ul {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .info-list li {
        color: var(--muted);
      }
      .source-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .file-list {
        min-width: 0;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      code {
        display: block;
        overflow-wrap: anywhere;
        color: #25313a;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .lifecycle-section,
      .atlas-section,
      .demo-section,
      .roadmap-section {
        padding: 30px 0;
        border-top: 1px solid var(--line);
      }
      .lifecycle-rail {
        display: grid;
        grid-template-columns: repeat(7, minmax(130px, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-x: auto;
      }
      .lifecycle-rail li {
        min-width: 130px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .step-number {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin-bottom: 10px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }
      .lifecycle-rail strong {
        display: block;
        margin-bottom: 6px;
      }
      .lifecycle-rail p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .atlas-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .atlas-item {
        min-height: 120px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .atlas-item:hover {
        border-color: var(--accent-2);
        background: var(--warn-soft);
      }
      .atlas-item span,
      .atlas-item strong,
      .atlas-item small {
        display: block;
      }
      .atlas-item span {
        margin-bottom: 20px;
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 800;
      }
      .atlas-item small {
        margin-top: 8px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .demo-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 18px;
      }
      .demo-pane,
      .state-pane {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .composer {
        border: 1px solid #aab7c2;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        min-height: 3.5rem;
        outline: none;
        white-space: pre-wrap;
        line-height: 1.5;
        background: #fff;
      }
      .composer:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .18); }
      .composer:empty::before,
      .composer:has(> [data-block-kind="text"]:only-child:empty)::before {
        content: attr(data-placeholder); color: #8c959f; pointer-events: none;
      }
      .chip {
        display: inline-block; padding: 0 6px; margin: 0 1px; border-radius: 4px;
        background: #ddf4ff; color: #0969da; font-weight: 500; user-select: none;
      }
      [data-block-kind="command"] .chip { background: #fff8c5; color: #59460e; }
      .popover {
        list-style: none; padding: 4px; margin: 4px 0 0; border: 1px solid #d0d7de;
        border-radius: 6px; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.08);
        max-width: 240px;
      }
      .popover li { padding: 4px 8px; border-radius: 4px; cursor: pointer; }
      .popover li[data-active=""] { background: #ddf4ff; }
      .hint { color: #57606a; font-size: 0.85rem; margin-top: 1rem; }
      .submitted {
        min-height: 160px;
        max-height: 300px;
        overflow: auto;
        margin: 0;
        background: #f6f8fa;
        padding: 0.75rem;
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        font-size: 0.85rem;
      }
      .finding-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .finding-grid p {
        margin: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .hero,
        .browser-grid,
        .demo-layout,
        .source-columns,
        .finding-grid {
          grid-template-columns: 1fr;
        }
        .hero-stats,
        .io-grid,
        .atlas-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .concept-tree {
          position: static;
          padding-right: 0;
        }
        h1 { font-size: 40px; }
      }
      @media (max-width: 560px) {
        .page-shell {
          width: min(100vw - 20px, 1180px);
          padding-top: 18px;
        }
        .hero-stats,
        .io-grid,
        .atlas-grid {
          grid-template-columns: 1fr;
        }
        .hero {
          padding-top: 14px;
        }
        h1 { font-size: 34px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
