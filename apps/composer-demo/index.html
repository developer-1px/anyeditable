<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@p/anyeditable · 기술 노트</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2328;
        --muted: #656d76;
        --line: #d0d7de;
        --soft: #f6f8fa;
        --code: #0d1117;
        --link: #0969da;
        --green: #1a7f37;
        --yellow: #fff8c5;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      button, input { font: inherit; }
      .doc {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0 80px;
      }
      .doc-header,
      .notebook-section {
        border-bottom: 1px solid var(--line);
        padding: 28px 0;
      }
      .kicker {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 {
        margin-bottom: 14px;
        font-size: 38px;
        line-height: 1.15;
        letter-spacing: 0;
      }
      h2 {
        margin-bottom: 14px;
        font-size: 25px;
        line-height: 1.25;
        letter-spacing: 0;
      }
      h3 {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.25;
        letter-spacing: 0;
      }
      p {
        max-width: 760px;
        margin-bottom: 14px;
      }
      a { color: var(--link); }
      code {
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .install,
      .code-cell pre,
      .observe pre {
        overflow: auto;
        border-radius: 6px;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .install {
        display: inline-block;
        margin: 4px 0 0;
        padding: 10px 12px;
        background: var(--soft);
        border: 1px solid var(--line);
      }
      .api-groups {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 18px;
      }
      .api-groups section,
      .playground,
      .observe,
      .code-cell {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        padding: 14px;
      }
      .api-groups dl {
        display: grid;
        gap: 10px;
        margin: 0;
      }
      .api-groups div {
        display: grid;
        gap: 3px;
      }
      .api-groups dt,
      .api-groups dd {
        margin: 0;
      }
      .api-groups dd {
        color: var(--muted);
      }
      .example {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, .8fr);
        gap: 14px;
        margin-top: 18px;
      }
      .code-cell {
        grid-column: 1 / -1;
      }
      .code-cell pre,
      .observe pre {
        margin: 0;
        padding: 12px;
      }
      .code-cell pre {
        background: var(--code);
        color: #e6edf3;
      }
      .observe pre {
        max-height: 260px;
        background: var(--soft);
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }
      .observe pre + pre {
        margin-top: 10px;
      }
      .cell-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .visual-card {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 16px;
        min-height: 220px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }
      .visual-art {
        min-height: 190px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(9, 105, 218, .18), rgba(26, 127, 55, .14)),
          repeating-linear-gradient(45deg, #fff, #fff 10px, #f1f6fb 10px, #f1f6fb 20px);
      }
      .visual-copy {
        display: grid;
        align-content: center;
        gap: 10px;
        min-width: 0;
      }
      .visual-field,
      .visual-input {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        overflow-wrap: anywhere;
      }
      .visual-field {
        cursor: pointer;
      }
      .visual-field:hover,
      .visual-field.active {
        border-color: var(--green);
        background: #dafbe1;
      }
      .visual-field.status,
      .visual-input.status {
        justify-self: start;
        width: auto;
        padding: 3px 8px;
        background: #ddf4ff;
        color: #0969da;
        font-size: 13px;
        font-weight: 700;
      }
      .visual-field.title,
      .visual-input.title {
        padding: 4px 6px;
        font-size: 27px;
        line-height: 1.15;
        font-weight: 800;
      }
      .visual-field.caption,
      .visual-input.caption {
        padding: 4px 6px;
        color: var(--muted);
        line-height: 1.55;
      }
      textarea.visual-input.caption {
        min-height: 88px;
        resize: vertical;
        font: inherit;
      }
      .visual-input {
        background: #fff;
        border-color: var(--green);
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 127, 55, .14);
      }
      .subexample-title {
        margin-top: 26px;
      }
      .cell,
      .cell-input {
        width: 100%;
        min-height: 64px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--soft);
        color: var(--ink);
        text-align: left;
      }
      .cell {
        cursor: pointer;
      }
      .cell:hover,
      .cell.active {
        border-color: var(--green);
        background: #dafbe1;
      }
      .cell span,
      .cell strong {
        display: block;
      }
      .cell span {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .cell-input {
        background: #fff;
        outline: none;
      }
      .cell-input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(26, 127, 55, .14);
      }
      .composer {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        line-height: 1.55;
        outline: none;
        white-space: pre-wrap;
      }
      .composer:focus {
        border-color: var(--link);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, .14);
      }
      .composer:empty::before,
      .composer:has(> [data-block-kind="text"]:only-child:empty)::before {
        content: attr(data-placeholder);
        color: #8c959f;
        pointer-events: none;
      }
      .chip {
        display: inline-block;
        padding: 0 6px;
        margin: 0 1px;
        border-radius: 4px;
        background: #ddf4ff;
        color: #0969da;
        font-weight: 700;
        user-select: none;
      }
      .chip.command,
      [data-block-kind="command"] .chip {
        background: var(--yellow);
        color: #7d4e00;
      }
      .popover {
        max-width: 240px;
        margin: 6px 0 0;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(31, 35, 40, .12);
        list-style: none;
      }
      .popover li {
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .popover li[data-active=""] {
        background: #ddf4ff;
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .flow {
        display: grid;
        gap: 10px;
        margin: 14px 0 0;
        padding-left: 20px;
      }
      .flow li span {
        display: block;
        color: var(--muted);
      }
      ul {
        padding-left: 22px;
      }
      @media (max-width: 760px) {
        .doc {
          width: min(100vw - 20px, 980px);
          padding-top: 18px;
        }
        .api-groups,
        .example,
        .cell-grid,
        .visual-card {
          grid-template-columns: 1fr;
        }
        h1 { font-size: 30px; }
        h2 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
